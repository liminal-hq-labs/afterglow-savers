# One job per check, so a pull request's checks list names exactly what passed or failed.
# The Win32 and Windows 3.x builds use the pinned stable toolchain with `RUSTC_BOOTSTRAP` and build-std, so they run here too; the Wine
# smoke and the ReactOS guest need Wine and QEMU, so `make check` stays the full local gate.
