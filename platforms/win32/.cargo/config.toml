# Cargo settings for the Win32 builds: no C runtime, linked by lld-link, subsystem Windows.
#
# (c) Copyright 2026 Liminal HQ, Scott Morris
# SPDX-License-Identifier: Apache-2.0 OR MIT

# The target is chosen by build.sh, so the host unit tests are not affected. Every target aborts a panic where it stands
# (`panic=immediate-abort`, which needs the unstable options and the standard library built from source, as build.sh does): the panic
# handler only exits, so the message machinery is dead weight.
[target.i586-win32]
linker = "rust-lld"
rustflags = [
	"-C", "linker-flavor=lld-link",
	# No CRT and no std, so the entry point is ours and nothing newer than Windows 95 gets imported.
	"-C", "link-arg=/NODEFAULTLIB",
	"-C", "link-arg=/ENTRY:start",
	# A GUI program; subsystem version 4.0 is what the Windows 9x loader expects and ReactOS and NT accept.
	"-C", "link-arg=/SUBSYSTEM:WINDOWS,4.0",
	# Load at the preferred base with no relocations.
	"-C", "link-arg=/FIXED",
	"-C", "link-arg=/DYNAMICBASE:NO",
	"-C", "link-arg=/FILEALIGN:512",
	# The program keeps its state on the heap and the stack, so the empty `.data` section is folded away.
	"-C", "link-arg=/MERGE:.data=.rdata",
	# A fixed timestamp and no build path in the output, so two builds of the same source are the same file.
	"-C", "link-arg=/DEBUG:NONE",
	"-C", "link-arg=/Brepro",
	# Panic messages carry no file names (the panic handler exits), which would otherwise embed the build path.
	"-Z", "location-detail=none", "-C", "panic=immediate-abort", "-Z", "unstable-options",
]

# x86-64 keeps its relocations and ASLR with high entropy; the subsystem version is the oldest the architecture's Windows has (XP x64).
[target.x86_64-win32]
linker = "rust-lld"
rustflags = [
	"-C", "linker-flavor=lld-link",
	"-C", "link-arg=/NODEFAULTLIB",
	"-C", "link-arg=/ENTRY:start",
	"-C", "link-arg=/SUBSYSTEM:WINDOWS,5.02",
	"-C", "link-arg=/DYNAMICBASE",
	"-C", "link-arg=/HIGHENTROPYVA",
	"-C", "link-arg=/FILEALIGN:512",
	"-C", "link-arg=/MERGE:.data=.rdata",
	"-C", "link-arg=/DEBUG:NONE",
	"-C", "link-arg=/Brepro",
	"-Z", "location-detail=none", "-C", "panic=immediate-abort", "-Z", "unstable-options",
]
